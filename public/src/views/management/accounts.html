<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuentas | Hospital de Clínicas</title>
  <link rel="icon" type="image/x-icon" href="../../../assets/hospital-dark.ico">
  <link rel="stylesheet" href="../../css/main-menu.css?v=20261012-settings">
  <link rel="stylesheet" href="../../css/management/routes.css?v=20261004-controls-design">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="../../js/api-client.js" defer></script>
  <script src="../../js/auth-session.js?v=20261014-audit" defer></script>
  <script src="../../js/main-menu.js?v=20260927-global" defer></script>
  <script src="../../js/universal-search.js?v=20261014-surveys" defer></script>
  <script src="../../js/management/accounts.js?v=20261014-audit" defer></script>
  <link rel="stylesheet" href="../../css/management/accounts.css">
</head>
<body class="routes-page">
  <main class="app-shell">
    <aside class="sidebar">
      <button type="button" class="sidebar-action" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="sidebar-nav" aria-label="Navegación principal">
        <div class="nav-indicator"></div>
        <a href="../main-menu.html" class="nav-item"><img src="../../../assets/Icons/house-icon.svg" alt=""><span>Inicio</span></a>
        <a href="../documents/documents.html" class="nav-item"><img src="../../../assets/Icons/folder-icon.svg" alt=""><span>Documentos</span></a>
        <a href="../traces/trace.html" class="nav-item"><img src="../../../assets/Icons/location-icon.svg" alt=""><span>Ambulancias</span></a>
        <a href="../analytics/analytics.html" class="nav-item"><img src="../../../assets/Icons/analytics-icon.svg" alt=""><span>Reportes</span></a>
        <a href="../calendar/calendar.html" class="nav-item"><img src="../../../assets/Icons/calendar-icon.svg" alt=""><span>Calendario</span></a>
        <a href="../surveys/survey.html" class="nav-item"><img src="../../../assets/Icons/survey-icon.svg" alt=""><span>Encuestas</span></a>
        <a href="management.html" class="nav-item active" aria-current="page"><img src="../../../assets/Icons/database-cog.svg" alt=""><span>Gestión</span></a>
        <div class="nav-spacer"></div>
        <a href="../settings.html" class="nav-item"><img src="../../../assets/Icons/settings-icon.svg" alt=""><span>Configuración</span></a>
      </nav>
    </aside>

    <div class="routes-layout">
      <header class="topbar">
        <div class="brand"><img src="../../../assets/Icons/hospital-logo.png" alt=""><span>HOSPITAL DE CLINICAS</span></div>
        <div class="search-wrapper">
          <input type="search" class="search-input" placeholder="Buscar una acción o sección..." aria-label="Buscar una acción o sección">
          <button type="button" class="topbar-action search-action" aria-label="Abrir búsqueda" aria-expanded="false"><img src="../../../assets/Icons/search-icon.svg" alt=""></button>
        </div>
      </header>

      <section class="routes-content" aria-label="Gestión de cuentas">
        <div class="routes-heading"><a href="management.html" class="routes-back" aria-label="Volver a Gestión">←</a><h1>Cuentas del personal</h1></div>
        <div class="routes-workspace">
          <section class="route-directory" aria-label="Listado de cuentas">
            <label class="route-search"><input type="search" id="account-search" aria-label="Buscar cuenta" placeholder="Buscar usuario o email..."></label>
            <div class="catalog-filters"><select id="account-state" aria-label="Estado de cuenta"><option value="">Todas</option><option value="pending">Pendientes</option><option value="active">Activas</option><option value="disabled">Desactivadas</option></select></div>
            <div class="route-list detail-scroll" id="account-list"></div><p id="account-count" role="status"></p>
          </section>
          <aside class="route-detail" aria-label="Detalle de cuenta">
            <div class="detail-scroll" id="account-detail"><h2>Seleccioná una cuenta</h2></div>
          </aside>
        </div>
      </section>
    </div>
  </main>
  <dialog class="route-dialog" id="account-dialog" aria-labelledby="account-title">
    <form id="account-form" novalidate>
      <div class="dialog-heading"><h2 id="account-title">Administrar cuenta</h2></div>
      <div class="form-scroll"><p id="account-name"></p><fieldset id="account-roles" class="form-section account-roles"><legend>Permisos de la cuenta</legend>
        <label><input type="checkbox" name="role" value="staff"> Personal</label>
        <label><input type="checkbox" name="role" value="records_manager"> Registros clínicos</label>
        <label><input type="checkbox" name="role" value="dispatcher"> Coordinación de traslados</label>
        <label><input type="checkbox" name="role" value="admin"> Administración de cuentas</label>
      </fieldset><label id="password-label" class="form-section" hidden>Nueva contraseña<input type="password" id="account-password" autocomplete="new-password" minlength="12" maxlength="72"></label></div>
      <div class="dialog-actions"><button class="secondary-button" type="button" id="account-cancel">Cancelar</button><button class="primary-button" type="submit" id="account-save">Guardar</button></div>
    </form>
  </dialog>
  <p class="route-toast" id="account-status" role="status" hidden></p>
</body>
</html>
