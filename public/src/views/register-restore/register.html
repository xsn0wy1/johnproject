<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="registration.registro">Registro</title>
    <link rel="stylesheet" href="../../css/login-register/log-reg.css?v=20261019-auth-effects">
    <link rel="stylesheet" href="../../css/login-register/auth-interactions.css?v=20261019-auth-link-color">
    <link rel="icon" type="image/x-icon" href="../../../assets/hospital-gradient.ico">
  <script src="../../js/i18n.js?v=20261019-i18n" defer></script>
  <script src="../../js/api-client.js?v=20261019-i18n" defer></script>
  <script src="../../js/auth-session.js?v=20261019-i18n" defer></script>
</head>

<body>
    <div class="tarjeta">
        <h1 data-i18n="registration.registro">Registro</h1>
       <form
    id="registerForm"
    method="POST"
    action="../../../api/v1/auth/register.php">

    <input
        type="text"
        name="username"
        autocomplete="username"
        maxlength="50"
        placeholder="Usuario" data-i18n-placeholder="login.usuario"
        required>

    <div class="password-wrapper">
        <input
            type="password"
            id="contraseña"
            name="password"
            autocomplete="new-password"
            placeholder="Contraseña" data-i18n-placeholder="login.contrasena"
            minlength="12"
            maxlength="72"
            required>

        <button
            type="button"
            id="togglePasswordBtn"
            class="btn-toggle-eye">

            <img
                src="../../../assets/Icons/eye.svg"
                id="eyeIcon"
                alt="Mostrar contraseña" data-i18n-alt="registration.mostrar_contrasena">
        </button>
    </div>

    <div class="strength-meter">
        <div id="strengthBar" class="strength-bar"></div>
    </div>

    <span
        id="strengthText"
        class="strength-text">
    </span>

    <input
        type="email"
        name="email"
        placeholder="Email" data-i18n-placeholder="settings.email"
        required>

    <input
        type="text"
        name="national_id"
        maxlength="20"
        placeholder="CI" data-i18n-placeholder="registration.ci"
        required>

    <button type="submit" data-i18n="registration.registrarse">
        Registrarse
    </button>

    <p id="registerMessage" role="status" aria-live="polite"></p>

</form>
        <p>
            <i18n-text data-i18n="registration.ya_tienes_cuenta" style="display:contents">¿Ya tienes cuenta?</i18n-text>
            <a href="../../../index.html" data-i18n="registration.iniciar_sesion">Iniciar Sesion</a>
        </p>
    </div>
    
  <script src="../../js/login-register/register.js?v=20261019-i18n"></script>
</body>

</html>
