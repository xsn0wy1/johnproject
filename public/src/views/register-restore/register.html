<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../../css/login-register/log-reg.css">
    <link rel="icon" type="image/x-icon" href="../../../assets/hospital-gradient.ico">
  <script src="../../js/api-client.js" defer></script>
  <script src="../../js/auth-session.js?v=20261014-audit" defer></script>
</head>

<body>
    <div class="tarjeta">
        <h1>Registro</h1>
       <form
    id="registerForm"
    method="POST"
    action="../../../api/v1/auth/register.php">

    <input
        type="text"
        name="username"
        autocomplete="username"
        maxlength="50"
        placeholder="Usuario"
        required>

    <div class="password-wrapper">
        <input
            type="password"
            id="contraseña"
            name="password"
            autocomplete="new-password"
            placeholder="Contraseña"
            minlength="12"
            maxlength="72"
            required>

        <button
            type="button"
            id="togglePasswordBtn"
            class="btn-toggle-eye">

            <img
                src="../../../assets/Icons/eye.svg"
                id="eyeIcon"
                alt="Mostrar contraseña">
        </button>
    </div>

    <div class="strength-meter">
        <div id="strengthBar" class="strength-bar"></div>
    </div>

    <span
        id="strengthText"
        class="strength-text">
    </span>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required>

    <input
        type="text"
        name="national_id"
        maxlength="20"
        placeholder="CI"
        required>

    <button type="submit">
        Registrarse
    </button>

    <p id="registerMessage" role="status" aria-live="polite"></p>

</form>
        <p>
            ¿Ya tienes cuenta?
            <a href="../../../index.html">Iniciar Sesion</a>
        </p>
    </div>
    
  <script src="../../js/login-register/register.js"></script>
</body>

</html>
