<!DOCTYPE html>
<html lang="es" data-theme="dark" data-theme-styles="pass-restore auth-interactions">

<head>
  <script src="../../js/theme.js?v=20261019-light"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title data-i18n="registration.recuperar_contrasena">Recuperar contraseña</title>
    <link rel="stylesheet" href="../../css/login-register/pass-restore.css?v=20261019-auth-effects">
    <link rel="stylesheet" href="../../css/login-register/auth-interactions.css?v=20261019-recovery-field">
    <link rel="icon" type="image/x-icon" href="../../../assets/hospital-gradient.ico">
  <script src="../../js/i18n.js?v=20261019-i18n" defer></script>
  <script src="../../js/api-client.js?v=20261019-i18n" defer></script>
  <script src="../../js/login-register/recovery.js?v=20261019-recovery" defer></script>
  <link rel="stylesheet" href="../../css/theme.css?v=20261019-recovery-field">
</head>

<body>
  <div class="appearance-switch" role="group" aria-label="Apariencia" data-i18n-aria-label="theme.appearance"><button type="button" data-public-theme="dark" aria-pressed="true" aria-label="Tema oscuro" data-i18n-aria-label="settings.tema_oscuro" title="Tema oscuro" data-i18n-title="settings.tema_oscuro"><img src="../../../assets/Icons/moon-icon.svg" alt=""></button><button type="button" data-public-theme="light" aria-pressed="false" aria-label="Tema claro" data-i18n-aria-label="settings.tema_claro" title="Tema claro" data-i18n-title="settings.tema_claro"><img src="../../../assets/Icons/sun-icon.svg" alt=""></button></div>
    <div class="tarjeta">
        <h1 data-i18n="login.recuperar_contrasena">Recuperar Contraseña</h1>
        <p id="recovery-status" class="texto" role="status" hidden></p>
        <form id="recovery-request-form" novalidate>
            <div class="campo">
                <span aria-hidden="true">✉️</span>
                <input id="recovery-email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="Email" aria-label="Email" data-i18n-placeholder="settings.email" data-i18n-aria-label="settings.email">
            </div>
            <button type="submit" data-i18n="registration.enviar">
                Enviar
            </button>
        </form>
        <form id="recovery-password-form" hidden novalidate>
            <p class="texto" data-i18n="recovery.password_help">Usá al menos 12 caracteres y un máximo de 72 bytes.</p>
            <div class="campo">
                <span aria-hidden="true">🔒</span>
                <input id="recovery-password" name="new_password" type="password" autocomplete="new-password" required placeholder="Nueva contraseña" aria-label="Nueva contraseña" data-i18n-placeholder="recovery.new_password" data-i18n-aria-label="recovery.new_password">
            </div>
            <div class="campo">
                <span aria-hidden="true">🔒</span>
                <input id="recovery-confirmation" type="password" autocomplete="new-password" required placeholder="Confirmar contraseña" aria-label="Confirmar contraseña" data-i18n-placeholder="recovery.confirm_password" data-i18n-aria-label="recovery.confirm_password">
            </div>
            <button type="submit" data-i18n="recovery.save_password">Guardar contraseña</button>
            <a href="restore-password.html" class="volver" data-i18n="recovery.request_another">Solicitar otro enlace</a>
        </form>
        <a href="../../../index.html" class="volver" data-i18n="registration.volver_a_inicio_de_sesion">
            Volver a Inicio de Sesión
        </a>
    </div>
</body>

</html>
